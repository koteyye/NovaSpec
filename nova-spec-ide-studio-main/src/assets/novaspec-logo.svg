<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E31E24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A00F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central AI core with granat style -->
  <circle cx="256" cy="256" r="50" fill="none" stroke="url(#primaryGradient)" stroke-width="6"/>
  <circle cx="256" cy="256" r="45" fill="none" stroke="#E31E24" stroke-width="2" opacity="0.3"/>
  
  <!-- Neural network nodes (8 main nodes) - granat red theme -->
  <circle cx="256" cy="156" r="12" fill="#E31E24" stroke="#E31E24" stroke-width="2"/>
  <circle cx="330" cy="186" r="12" fill="#C41E3A" stroke="#C41E3A" stroke-width="2"/>
  <circle cx="356" cy="256" r="12" fill="#E31E24" stroke="#E31E24" stroke-width="2"/>
  <circle cx="330" cy="326" r="12" fill="#A00F2F" stroke="#A00F2F" stroke-width="2"/>
  <circle cx="256" cy="356" r="12" fill="#E31E24" stroke="#E31E24" stroke-width="2"/>
  <circle cx="182" cy="326" r="12" fill="#C41E3A" stroke="#C41E3A" stroke-width="2"/>
  <circle cx="156" cy="256" r="12" fill="#E31E24" stroke="#E31E24" stroke-width="2"/>
  <circle cx="182" cy="186" r="12" fill="#A00F2F" stroke="#A00F2F" stroke-width="2"/>
  
  <!-- Outer star nodes with glow -->
  <circle cx="256" cy="120" r="8" fill="#E31E24" opacity="0.8"/>
  <circle cx="356" cy="156" r="6" fill="#C41E3A" opacity="0.8"/>
  <circle cx="392" cy="256" r="8" fill="#E31E24" opacity="0.8"/>
  <circle cx="356" cy="356" r="6" fill="#A00F2F" opacity="0.8"/>
  <circle cx="256" cy="392" r="8" fill="#E31E24" opacity="0.8"/>
  <circle cx="156" cy="356" r="6" fill="#C41E3A" opacity="0.8"/>
  <circle cx="120" cy="256" r="8" fill="#E31E24" opacity="0.8"/>
  <circle cx="156" cy="156" r="6" fill="#A00F2F" opacity="0.8"/>
  
  <!-- Connection lines from center to main nodes -->
  <line x1="256" y1="256" x2="256" y2="156" stroke="#E31E24" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="330" y2="186" stroke="#C41E3A" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="356" y2="256" stroke="#E31E24" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="330" y2="326" stroke="#A00F2F" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="256" y2="356" stroke="#E31E24" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="182" y2="326" stroke="#C41E3A" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="156" y2="256" stroke="#E31E24" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="182" y2="186" stroke="#A00F2F" stroke-width="3" opacity="0.6"/>
  
  <!-- Lines from main nodes to outer stars -->
  <line x1="256" y1="156" x2="256" y2="120" stroke="#E31E24" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="186" x2="356" y2="156" stroke="#C41E3A" stroke-width="1.5" opacity="0.4"/>
  <line x1="356" y1="256" x2="392" y2="256" stroke="#E31E24" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="326" x2="356" y2="356" stroke="#A00F2F" stroke-width="1.5" opacity="0.4"/>
  <line x1="256" y1="356" x2="256" y2="392" stroke="#E31E24" stroke-width="1.5" opacity="0.4"/>
  <line x1="182" y1="326" x2="156" y2="356" stroke="#C41E3A" stroke-width="1.5" opacity="0.4"/>
  <line x1="156" y1="256" x2="120" y2="256" stroke="#E31E24" stroke-width="1.5" opacity="0.4"/>
  <line x1="182" y1="186" x2="156" y2="156" stroke="#A00F2F" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Small accent stars -->
  <circle cx="290" cy="140" r="3" fill="#E31E24" opacity="0.7"/>
  <circle cx="340" cy="220" r="3" fill="#C41E3A" opacity="0.7"/>
  <circle cx="370" cy="290" r="3" fill="#E31E24" opacity="0.7"/>
  <circle cx="290" cy="370" r="3" fill="#A00F2F" opacity="0.7"/>
  <circle cx="220" cy="370" r="3" fill="#E31E24" opacity="0.7"/>
  <circle cx="140" cy="290" r="3" fill="#C41E3A" opacity="0.7"/>
  <circle cx="140" cy="220" r="3" fill="#E31E24" opacity="0.7"/>
  <circle cx="220" cy="140" r="3" fill="#A00F2F" opacity="0.7"/>
  
  <!-- Glow effects -->
  <circle cx="256" cy="256" r="50" fill="none" stroke="#E31E24" stroke-width="2" opacity="0.1"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#E31E24" stroke-width="1" opacity="0.05"/>
</svg>
