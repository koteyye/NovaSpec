openapi: 3.0.3
info:
  title: NovaSpec Core API
  description: API для базовой архитектуры и конфигурации приложения
  version: 1.0.0

paths:
  /api/config:
    get:
      summary: Получить конфигурацию приложения
      responses:
        '200':
          description: Успешное получение конфигурации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfiguration'
        '404':
          description: Конфигурация не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppError'
    
    put:
      summary: Обновить конфигурацию приложения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfiguration'
      responses:
        '200':
          description: Конфигурация успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageResult'
        '400':
          description: Некорректные данные конфигурации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppError'

  /api/config/theme:
    get:
      summary: Получить конфигурацию темы
      responses:
        '200':
          description: Успешное получение темы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeConfiguration'
        '404':
          description: Тема не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppError'
    
    put:
      summary: Обновить конфигурацию темы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeConfiguration'
      responses:
        '200':
          description: Тема успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageResult'

  /api/navigation/state:
    get:
      summary: Получить состояние навигации
      responses:
        '200':
          description: Успешное получение состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationState'
    
    post:
      summary: Обновить состояние навигации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationState'
      responses:
        '200':
          description: Состояние успешно обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageResult'

  /api/storage/validate:
    post:
      summary: Валидировать данные хранения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
      responses:
        '200':
          description: Данные валидны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageResult'
        '400':
          description: Данные невалидны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  schemas:
    AppConfiguration:
      type: object
      required:
        - language
        - theme
        - autoSave
        - notificationsEnabled
      properties:
        language:
          type: string
          enum: [ru, en]
          description: Язык интерфейса
        theme:
          type: string
          enum: [light, dark, system]
          description: Тема оформления
        autoSave:
          type: boolean
          description: Автосохранение настроек
        notificationsEnabled:
          type: boolean
          description: Включены уведомления
        lastOpenedProject:
          type: string
          nullable: true
          description: Путь к последнему проекту

    ThemeConfiguration:
      type: object
      required:
        - primaryColor
        - secondaryColor
        - backgroundColor
        - surfaceColor
        - errorColor
      properties:
        primaryColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Основной цвет в HEX формате
        secondaryColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Вторичный цвет в HEX формате
        backgroundColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Цвет фона в HEX формате
        surfaceColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Цвет поверхности в HEX формате
        errorColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Цвет ошибки в HEX формате
        borderRadius:
          type: number
          format: double
          default: 8.0
          description: Радиус скругления
        fontFamily:
          type: string
          default: 'Roboto'
          description: Шрифт

    NavigationState:
      type: object
      required:
        - currentRoute
        - history
        - parameters
      properties:
        currentRoute:
          type: string
          description: Текущий маршрут
        history:
          type: array
          items:
            type: string
          description: История навигации
        parameters:
          type: object
          additionalProperties: true
          description: Параметры маршрута

    StorageResult:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Успешность операции
        data:
          type: object
          nullable: true
          description: Данные если успешно
        error:
          type: string
          nullable: true
          description: Ошибка если неуспешно

    AppError:
      type: object
      required:
        - code
        - message
        - severity
        - timestamp
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Сообщение для пользователя
        technicalDetails:
          type: string
          nullable: true
          description: Технические детали
        severity:
          $ref: '#/components/schemas/ErrorSeverity'
        timestamp:
          type: string
          format: date-time
          description: Время возникновения

    ErrorSeverity:
      type: string
      enum: [info, warning, error, critical]
      description: Уровень критичности ошибки

    ValidationError:
      type: object
      required:
        - field
        - message
        - value
      properties:
        field:
          type: string
          description: Поле с ошибкой
        message:
          type: string
          description: Сообщение об ошибке
        value:
          type: object
          description: Значение вызвавшее ошибку

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []