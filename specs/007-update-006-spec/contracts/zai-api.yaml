openapi: 3.0.3
info:
  title: Z.AI API Integration
  description: API спецификация для интеграции с Z.AI провайдером
  version: 1.0.0
servers:
  - url: https://api.z.ai/api/coding/paas/v4
    description: Coding Plan API endpoint
  - url: https://api.z.ai/api/paas/v4
    description: Pay-as-you-go API endpoint

paths:
  /models:
    get:
      summary: Получить доступные модели
      description: Валидация API ключа и получение списка доступных моделей
      operationId: getModels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
              examples:
                success:
                  summary: Успешная валидация
                  value:
                    object: "list"
                    data:
                      - id: "gpt-4"
                        object: "model"
                      - id: "gpt-3.5-turbo"
                        object: "model"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/completions:
    post:
      summary: Создать чат-комплит
      description: Отправить запрос к AI модели для генерации ответа
      operationId: createChatCompletion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ModelsResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          description: Тип объекта
          example: "list"
        data:
          type: array
          description: Список доступных моделей
          items:
            $ref: '#/components/schemas/ModelInfo'
          example:
            - id: "gpt-4"
              object: "model"
            - id: "gpt-3.5-turbo"
              object: "model"

    ModelInfo:
      type: object
      required:
        - id
        - object
      properties:
        id:
          type: string
          description: Идентификатор модели
          example: "gpt-4"
        object:
          type: string
          description: Тип объекта
          example: "model"
        created:
          type: integer
          format: int64
          description: Время создания модели (Unix timestamp)
          example: 1677652288
        owned_by:
          type: string
          description: Владелец модели
          example: "zai"

    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Модель AI
          example: "gpt-4"
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: Массив сообщений в чате
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
          description: Максимальное количество токенов в ответе
          example: 1000
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Температура генерации (креативность)
          example: 0.7
        stream:
          type: boolean
          description: Потоковая передача ответа
          default: false

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant]
          description: Роль отправителя сообщения
        content:
          type: string
          description: Содержимое сообщения
          example: "Привет, как дела?"

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: Уникальный идентификатор ответа
          example: "chatcmpl-123"
        object:
          type: string
          example: "chat.completion"
        created:
          type: integer
          format: int64
          description: Время создания ответа (Unix timestamp)
          example: 1677652288
        model:
          type: string
          description: Использованная модель
          example: "gpt-4"
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatChoice'
        usage:
          $ref: '#/components/schemas/TokenUsage'

    ChatChoice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
          description: Индекс выбора
          example: 0
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string
          enum: [stop, length, content_filter, function_call]
          description: Причина завершения генерации
          example: "stop"

    TokenUsage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          description: Количество токенов в промпте
          example: 10
        completion_tokens:
          type: integer
          description: Количество токенов в ответе
          example: 20
        total_tokens:
          type: integer
          description: Общее количество токенов
          example: 30

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
          properties:
            message:
              type: string
              description: Описание ошибки
              example: "Invalid API key"
            type:
              type: string
              description: Тип ошибки
              example: "invalid_request_error"
            code:
              type: string
              description: Код ошибки
              example: "invalid_api_key"

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Неавторизованный доступ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'