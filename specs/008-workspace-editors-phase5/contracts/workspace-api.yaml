openapi: 3.0.3
info:
  title: Workspace API
  description: API для управления рабочим пространством и файлами
  version: 1.0.0

paths:
  /workspace/files:
    get:
      summary: Получить структуру файлов проекта
      parameters:
        - name: path
          in: query
          description: Путь к директории
          schema:
            type: string
      responses:
        '200':
          description: Успешное получение структуры файлов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileExplorerNode'

  /workspace/files/{path}:
    get:
      summary: Получить содержимое файла
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Содержимое файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFile'
        '404':
          description: Файл не найден

    delete:
      summary: Удалить файл
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Файл успешно удален
        '404':
          description: Файл не найден

    put:
      summary: Переименовать файл
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newName:
                  type: string
      responses:
        '200':
          description: Файл успешно переименован
        '404':
          description: Файл не найден

  /workspace/files:
    post:
      summary: Создать новый файл или папку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                type:
                  type: string
                  enum: [file, folder]
                content:
                  type: string
                  description: Содержимое файла (только для файлов)
      responses:
        '201':
          description: Файл/папка успешно созданы
        '400':
          description: Неверные параметры

  /workspace/tabs:
    get:
      summary: Получить список открытых вкладок
      responses:
        '200':
          description: Список вкладок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceTab'

    post:
      summary: Открыть новую вкладку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filePath:
                  type: string
      responses:
        '201':
          description: Вкладка успешно открыта
        '404':
          description: Файл не найден

  /workspace/tabs/{tabId}:
    delete:
      summary: Закрыть вкладку
      parameters:
        - name: tabId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Вкладка успешно закрыта

    put:
      summary: Обновить содержимое вкладки
      parameters:
        - name: tabId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                mode:
                  type: string
                  enum: [render, edit]
      responses:
        '200':
          description: Вкладка успешно обновлена

components:
  schemas:
    FileExplorerNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, folder]
        children:
          type: array
          items:
            $ref: '#/components/schemas/FileExplorerNode'
        isExpanded:
          type: boolean
        isRenaming:
          type: boolean
        editingName:
          type: string

    WorkspaceTab:
      type: object
      properties:
        id:
          type: string
        filePath:
          type: string
        fileName:
          type: string
        contentType:
          type: string
          enum: [markdown, html, audio, swagger, text, binary, unknown]
        mode:
          type: string
          enum: [render, edit]
        isModified:
          type: boolean
        lastModified:
          type: string
          format: date-time
        content:
          type: string

    OpenFile:
      type: object
      properties:
        path:
          type: string
        name:
          type: string
        contentType:
          type: string
          enum: [markdown, html, audio, swagger, text, binary, unknown]
        content:
          type: string
        size:
          type: integer
        lastModified:
          type: string
          format: date-time
        isTextFile:
          type: boolean
        metadata:
          type: object